<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | MuleSoft Engineering Blogs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070d18;
      --card: #101c36;
      --border: #1e2f54;
      --mule-blue: #00a1e0;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(135deg, #00a1e0, #0176d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #00a1e0, #0176d3);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 12px 24px;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 161, 224, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="error-code">404</div>
    <h1>Resource Not Found</h1>
    <p>The requested endpoint does not exist or has been relocated to the latest MuleSoft 2026 Developer &amp; Architecture Hub.</p>
    <a href="/" class="btn">
      <span>← Return to MuleSoft Engineering Blogs</span>
    </a>
  </div>
</body>
</html>
